(()=>{
'use strict';
// All art, maps, content and rules live in this file. No asset downloads or libraries.
const $=id=>document.getElementById(id), canvas=$('world'),ctx=canvas.getContext('2d');
const KEY='pocket-quest-save-v2',LEGACY='pocket-quest-save-v1';
const weapons=[{name:'Bare hands',atk:0,price:0},{name:'Iron Sword',atk:2,price:12},{name:'Steel Saber',atk:5,price:55},{name:'Knight Blade',atk:8,price:135},{name:'Dawnsteel',atk:12,price:280}];
const armors=[{name:'Travel clothes',def:0,price:0},{name:'Leather Armor',def:1,price:10},{name:'Chainmail',def:3,price:50},{name:'Knight Plate',def:5,price:120},{name:'Runic Armor',def:7,price:250}];
const spells={ember:{name:'Ember',price:18,mp:3,desc:'Magic damage; burns for 2 extra damage on the next 2 turns.'},mend:{name:'Mend',price:25,mp:4,desc:'Restore 16 + your level HP. Also usable outside battle.'},frost:{name:'Frost',price:45,mp:5,desc:'Stronger magic damage; halves the enemy’s next attack.'}};
const creatures={
 slime:{name:'Green Slime',hp:8,atk:2,def:0,gold:4,xp:4,art:'slime',color:'#91cb68'},rat:{name:'Field Rat',hp:10,atk:3,def:0,gold:5,xp:5,art:'rat',color:'#b99580'},beetle:{name:'Amber Beetle',hp:14,atk:4,def:1,gold:7,xp:6,art:'beetle',color:'#d8a44f'},
 goblin:{name:'Briar Goblin',hp:22,atk:6,def:1,gold:10,xp:10,art:'goblin',color:'#8fa55d'},wolf:{name:'Wild Wolf',hp:26,atk:7,def:1,gold:12,xp:12,art:'wolf',color:'#afbbc7'},wisp:{name:'Wood Wisp',hp:19,atk:7,def:0,gold:11,xp:12,art:'wisp',color:'#9dcfff'},
 bat:{name:'Cave Bat',hp:29,atk:9,def:1,gold:15,xp:15,art:'bat',color:'#b59bcd'},golem:{name:'Stone Sentinel',hp:40,atk:11,def:3,gold:21,xp:20,art:'golem',color:'#abb4b6'},shade:{name:'Mine Shade',hp:35,atk:12,def:2,gold:19,xp:20,art:'wisp',color:'#ca9ff1'},
 elder:{name:'Briar Fang',hp:68,atk:10,def:2,gold:45,xp:40,art:'wolf',color:'#e4c19c',boss:true},keeper:{name:'The Hollow Keeper',hp:125,atk:16,def:4,gold:100,xp:90,art:'golem',color:'#bea995',boss:true}};
const fresh=()=>({v:2,level:1,xp:0,gold:0,maxHp:20,hp:20,maxMp:8,mp:8,baseAtk:3,weapon:0,armor:0,weapons:[0],armors:[0],spells:[],potions:0,ethers:0,herbs:0,ore:0,zone:'town',x:7,y:8,dir:'down',steps:0,nextEncounter:9,battle:null,wins:0,kills:{},claimed:[],opened:[],gathered:{},elder:false,keeper:false,seen:{town:true},log:'Welcome to Willowbrook. Walk to a door and press Interact. The inn offers a free bed; the notice board has work.'});
let s=fresh(),modal=null,lastFocus=null,storageOK=true,migrated=false;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function valid(raw){return raw&&raw.v===2&&Number.isInteger(raw.level)&&raw.level>=1&&raw.level<=9999&&['xp','gold','maxHp','hp','maxMp','mp','baseAtk','potions','ethers','herbs','ore','wins','steps','nextEncounter'].every(k=>Number.isFinite(raw[k])&&raw[k]>=0)&&raw.maxHp>0&&raw.maxMp>0&&raw.hp<=raw.maxHp&&raw.mp<=raw.maxMp&&Number.isInteger(raw.weapon)&&weapons[raw.weapon]&&Number.isInteger(raw.armor)&&armors[raw.armor]&&Array.isArray(raw.weapons)&&raw.weapons.every(i=>Number.isInteger(i)&&weapons[i])&&Array.isArray(raw.armors)&&raw.armors.every(i=>Number.isInteger(i)&&armors[i])&&raw.weapons.includes(raw.weapon)&&raw.armors.includes(raw.armor)&&Array.isArray(raw.spells)&&raw.spells.every(k=>spells[k])&&Array.isArray(raw.claimed)&&Array.isArray(raw.opened)&&raw.gathered&&typeof raw.gathered==='object'&&raw.kills&&typeof raw.kills==='object'&&raw.seen&&typeof raw.seen==='object'&&['town','meadow','forest','mine'].includes(raw.zone)&&Number.isInteger(raw.x)&&raw.x>=0&&raw.x<15&&Number.isInteger(raw.y)&&raw.y>=0&&raw.y<11&&(!raw.battle||(creatures[raw.battle.id]&&Number.isFinite(raw.battle.hp)&&raw.battle.hp>0&&raw.battle.hp<=creatures[raw.battle.id].hp&&Number.isInteger(raw.battle.turn)&&raw.battle.turn>=0));}
try{const raw=JSON.parse(localStorage.getItem(KEY));if(valid(raw))s={...fresh(),...raw};else{const old=JSON.parse(localStorage.getItem(LEGACY));if(old&&Number.isInteger(old.level)&&old.level>0&&Number.isFinite(old.gold)){s.level=old.level;s.xp=Math.max(0,old.xp||0);s.gold=Math.max(0,old.gold);s.maxHp=Math.max(20,old.maxHp||10);s.hp=s.maxHp;s.maxMp=8+(s.level-1)*2;s.mp=s.maxMp;s.baseAtk=Math.max(3,(old.atk||2)-(old.sword?2:0));if(old.sword){s.weapon=1;s.weapons.push(1)}if(old.armorBought){s.armor=1;s.armors.push(1)}migrated=true;s.log='Your original character has arrived in Willowbrook! Level, gold and purchased gear carried over. Visit the notice board to begin the new adventure.'}}}catch(_){storageOK=false}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));storageOK=true}catch(_){storageOK=false}$('saveStatus').textContent=storageOK?'Autosave · on this device':'Saving unavailable · export a backup';}
const attack=()=>s.baseAtk+weapons[s.weapon].atk,defense=()=>armors[s.armor].def,need=()=>s.level*10;
function award(xp){s.xp+=xp;let gained=0;while(s.xp>=need()){s.xp-=need();s.level++;s.maxHp+=5;s.maxMp+=2;s.baseAtk++;s.hp=s.maxHp;s.mp=s.maxMp;gained++}return gained?' Level '+s.level+'! Fully restored.':''}
function message(t){s.log=t;$('log').textContent=t}
// 15 × 11 maps. One tile is one walkable space; interaction points are separate from walls.
const maps={};function grid(fill){return Array.from({length:11},()=>Array(15).fill(fill))}function base(fill,border){let g=grid(fill);for(let y=0;y<11;y++)for(let x=0;x<15;x++)if(!x||x===14||!y||y===10)g[y][x]=border;return g}function path(g,x1,y1,x2,y2){for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)g[y][x]='.'}function obj(x,y,type,name,extra={}){return{x,y,type,name,...extra}}
let g=base('g','T');path(g,0,5,14,5);path(g,7,0,7,10);path(g,2,4,12,4);path(g,2,6,12,6);path(g,2,9,12,9);
const buildings=[{x:1,y:1,w:3,h:3,label:'INN',color:'#ae6650',kind:'inn',doorX:2,doorY:4},{x:6,y:1,w:3,h:3,label:'SMITH',color:'#668292',kind:'smith',doorX:7,doorY:4},{x:11,y:1,w:3,h:3,label:'SHOP',color:'#7d8059',kind:'shop',doorX:12,doorY:4},{x:11,y:7,w:3,h:2,label:'SAGE',color:'#8a70a0',kind:'sage',doorX:12,doorY:9}];buildings.forEach(b=>{for(let y=b.y;y<b.y+b.h;y++)for(let x=b.x;x<b.x+b.w;x++)g[y][x]='#'});g[6][7]='W';g[7][7]='W';
maps.town={name:'Willowbrook',hint:'A safe place to rest',g,buildings,objects:[...buildings.map(b=>obj(b.doorX,b.doorY,b.kind,b.label==='SMITH'?'Blacksmith':b.label==='SHOP'?'Apothecary':b.label==='SAGE'?'Sage’s study':'The Lantern Inn')),obj(2,7,'board','Notice board'),obj(4,6,'npc','Mara the keeper'),obj(9,7,'dummy','Training dummy'),obj(3,9,'chest','Old supply chest',{id:'townChest',gold:8}),obj(14,5,'exit','Meadow →',{zone:'meadow',tx:1,ty:5})]};
g=base('g','T');path(g,0,5,14,5);path(g,7,0,7,10);[[3,2],[4,2],[10,3],[11,3],[3,8],[4,8],[11,8]].forEach(([x,y])=>g[y][x]='T');[[1,1],[2,1],[1,2],[2,2],[12,8],[13,8],[12,9],[13,9]].forEach(([x,y])=>g[y][x]='W');
maps.meadow={name:'Sunstep Meadow',hint:'Slimes · rats · beetles',g,objects:[obj(0,5,'exit','← Willowbrook',{zone:'town',tx:13,ty:5}),obj(7,0,'exit','↑ Briarwood',{zone:'forest',tx:7,ty:9}),obj(14,5,'exit','Ember Mine →',{zone:'mine',tx:1,ty:5}),obj(5,3,'herb','Sunleaf',{id:'herb1'}),obj(9,7,'herb','Sunleaf',{id:'herb2'}),obj(5,8,'herb','Sunleaf',{id:'herb3'}),obj(12,2,'chest','Traveler’s chest',{id:'meadowChest',gold:15}),obj(7,9,'sign','Trail sign')],pool:['slime','slime','rat','beetle']};
g=base('g','T');path(g,7,0,7,10);path(g,3,5,11,5);[[2,2],[3,2],[4,2],[10,2],[11,2],[12,2],[2,3],[12,3],[2,7],[3,7],[11,7],[12,7],[4,8],[10,8],[1,5],[13,5]].forEach(([x,y])=>g[y][x]='T');
maps.forest={name:'Briarwood',hint:'Goblins · wolves · wisps',g,objects:[obj(7,10,'exit','↓ Sunstep Meadow',{zone:'meadow',tx:7,ty:1}),obj(7,2,'boss','Briar Fang',{id:'elder'}),obj(4,4,'herb','Moonleaf',{id:'herb4'}),obj(10,6,'herb','Moonleaf',{id:'herb5'}),obj(3,9,'chest','Ranger’s chest',{id:'forestChest',gold:30}),obj(11,4,'shrine','Old wayshrine')] ,pool:['goblin','wolf','wisp']};
g=base('c','R');path(g,0,5,13,5);path(g,7,2,7,9);[[3,2],[4,2],[10,3],[11,3],[3,7],[4,7],[10,8],[11,8],[1,1],[13,1]].forEach(([x,y])=>g[y][x]='R');
maps.mine={name:'Ember Mine',hint:'Bats · sentinels · shades',g,objects:[obj(0,5,'exit','← Sunstep Meadow',{zone:'meadow',tx:13,ty:5}),obj(7,2,'boss','The Hollow Keeper',{id:'keeper'}),obj(2,3,'ore','Iron vein',{id:'ore1'}),obj(11,6,'ore','Iron vein',{id:'ore2'}),obj(6,8,'ore','Iron vein',{id:'ore3'}),obj(12,2,'chest','Prospector’s chest',{id:'mineChest',gold:45})],pool:['bat','golem','shade']};
function walkable(zone,x,y){return x>=0&&x<15&&y>=0&&y<11&&!['T','W','R','#'].includes(maps[zone].g[y][x])}
if(!walkable(s.zone,s.x,s.y)){s.zone='town';s.x=7;s.y=8}
function active(o){return !(o.type==='boss'&&s[o.id]);}
function near(){const options=maps[s.zone].objects.filter(o=>active(o)&&Math.abs(o.x-s.x)+Math.abs(o.y-s.y)<=1);return options.sort((a,b)=>((a.x===s.x&&a.y===s.y)?-1:0)-((b.x===s.x&&b.y===s.y)?-1:0))[0]}
const vectors={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function move(dir){if(modal||s.battle)return;s.dir=dir;const [dx,dy]=vectors[dir],x=s.x+dx,y=s.y+dy;if(!walkable(s.zone,x,y)){draw();return}const block=maps[s.zone].objects.find(o=>o.x===x&&o.y===y&&active(o)&&['boss','npc','board','dummy','shrine'].includes(o.type));if(block){message('Press Interact: '+block.name+'.');ui();return}s.x=x;s.y=y;s.steps++;const portal=maps[s.zone].objects.find(o=>o.x===x&&o.y===y&&o.type==='exit');if(portal){travel(portal);return}if(s.zone!=='town'){s.nextEncounter--;if(s.nextEncounter<=0){const pool=maps[s.zone].pool;startBattle(pool[Math.floor(Math.random()*pool.length)]);return}}const o=near();if(o)message(o.type==='exit'?o.name+' · walk onto the path to travel.':o.name+' nearby. Press Interact.');ui();save()}
function travel(o){if(o.zone==='mine'&&!s.elder){message('Thorn roots seal the mine. Defeat Briar Fang in the north of Briarwood first.');s.x=13;s.y=5;ui();save();return}s.zone=o.zone;s.x=o.tx;s.y=o.ty;s.seen[s.zone]=true;s.nextEncounter=8+Math.floor(Math.random()*5);message(s.zone==='town'?'Willowbrook welcomes you home. The inn offers free rest.':'Entered '+maps[s.zone].name+'. Enemies may appear as you walk.');ui();save()}
function interact(){if(modal||s.battle)return;const o=near();if(!o){message('Walk beside a door, person, chest, plant, or sign to interact.');return}switch(o.type){case'exit':travel(o);break;case'inn':case'smith':case'shop':case'sage':open(o.type);break;case'board':open('quests');break;case'npc':open('mara');break;case'dummy':message('Training: Attack deals '+attack()+'. Armor blocks '+defense()+'. Power Strike unlocks at level 2. Guard halves a hit and restores 3 MP.');break;case'chest':if(s.opened.includes(o.id)){message('This chest is empty.')}else{s.opened.push(o.id);s.gold+=o.gold;s.potions++;message('Found '+o.gold+' gold and a Potion!')}break;case'herb':case'ore':if(s.gathered[o.id]!==undefined&&s.steps-s.gathered[o.id]<45){message('This spot needs time to replenish. Explore another '+(45-(s.steps-s.gathered[o.id]))+' steps.')}else{s.gathered[o.id]=s.steps;if(o.type==='herb')s.herbs++;else s.ore++;message(o.type==='herb'?'Gathered 1 herb. Bring three to the notice board, or brew potions at the shop.':'Mined 1 iron ore. Sell ore at the blacksmith for 8 gold each.')}break;case'sign':message('WEST: Willowbrook · NORTH: Briarwood (level 3+ advised) · EAST: Ember Mine (level 6+ advised).');break;case'shrine':s.mp=s.maxMp;message('The old wayshrine restores all your MP.');break;case'boss':open('boss',o.id);break}ui();save()}
function startBattle(id){s.battle={id,hp:creatures[id].hp,turn:0,burn:0,slow:false};message(creatures[id].name+' appears! Choose a command.');close(false);ui();save()}
function win(){const e=creatures[s.battle.id],id=s.battle.id;s.gold+=e.gold;s.wins++;s.kills[id]=(s.kills[id]||0)+1;let t=e.name+' defeated! +'+e.gold+' gold, +'+e.xp+' XP.';if(id==='elder'){s.elder=true;t+=' The thorn seal breaks. Ember Mine is open!'}if(id==='keeper'){s.keeper=true;t+=' You found the Sunbell! Return to Mara in town.'}if(!e.boss&&Math.random()<.22){s.potions++;t+=' Found a Potion.'}t+=award(e.xp);s.battle=null;s.nextEncounter=8+Math.floor(Math.random()*6);message(t);$('stage').classList.remove('victory');void $('stage').offsetWidth;$('stage').classList.add('victory');ui();save()}
function respond(guard=false){const b=s.battle,e=creatures[b.id];const heavy=b.turn%3===2;let damage=Math.max(1,e.atk+(heavy?Math.ceil(e.atk*.6):0)-defense());if(guard)damage=Math.max(1,Math.floor(damage/2));if(b.slow){damage=Math.max(1,Math.floor(damage/2));b.slow=false}b.turn++;s.hp=Math.max(0,s.hp-damage);let t=(heavy?' Its charged blow':' It')+' deals '+damage+' damage.';if(s.hp===0){let lost=Math.min(s.gold,Math.max(3,Math.floor(s.gold*.1)));s.gold-=lost;s.hp=s.maxHp;s.mp=s.maxMp;s.battle=null;s.zone='town';s.x=2;s.y=5;s.nextEncounter=10;message('You awaken at the inn, fully healed. Lost '+lost+' gold; all equipment and quest progress are safe.');}else{message(s.log+t+(b.turn%3===2?' It is charging a heavy blow—Guard or Frost!':''));}ui();save()}
function fight(kind){if(!s.battle)return;const b=s.battle,e=creatures[b.id];if(kind==='magic'||kind==='item'){open(kind);return}if(kind==='flee'){s.battle=null;s.nextEncounter=7;message('You escaped safely. No rewards gained.');ui();save();return}if(kind==='strike'&&(s.level<2||s.mp<3))return;let damage=0,t='';if(kind==='attack'){damage=Math.max(1,attack()-e.def);t='You attack for '+damage+'.'}else if(kind==='strike'){s.mp-=3;damage=Math.max(1,Math.floor(attack()*1.7)-e.def);t='Power Strike deals '+damage+'!'}else if(kind==='guard'){s.mp=Math.min(s.maxMp,s.mp+3);t='You brace yourself and recover 3 MP.'}else if(spells[kind]){if(!s.spells.includes(kind)||s.mp<spells[kind].mp)return;s.mp-=spells[kind].mp;if(kind==='mend'){let heal=Math.min(s.maxHp-s.hp,16+s.level);s.hp+=heal;t='Mend restores '+heal+' HP.'}if(kind==='ember'){damage=7+s.level*2;b.burn=3;t='Ember deals '+damage+' and inflicts burn.'}if(kind==='frost'){damage=11+s.level*2;b.slow=true;t='Frost deals '+damage+' and weakens the next hit.'}}else if(kind==='potion'){if(!s.potions)return;s.potions--;let heal=Math.min(s.maxHp-s.hp,25);s.hp+=heal;t='Potion restores '+heal+' HP.'}else if(kind==='ether'){if(!s.ethers)return;s.ethers--;let gain=Math.min(s.maxMp-s.mp,12);s.mp+=gain;t='Ether restores '+gain+' MP.'}else return;
b.hp-=damage;if(b.burn>0){b.burn--;if(b.burn<2){b.hp-=2;t+=' Burn deals 2.'}}message(t);close(false);if(b.hp<=0){win();return}respond(kind==='guard');$('stage').classList.remove('flash');void $('stage').offsetWidth;$('stage').classList.add('flash')}

function act(action){const [cmd,arg]=action.split(':');if(cmd==='cast'){fight(arg);return}if(cmd==='boss'){startBattle(arg);return}if(cmd==='rest'){s.hp=s.maxHp;s.mp=s.maxMp;message('You sleep by the lantern’s warm light. HP and MP fully restored.');close()}else if(cmd==='lunch'&&s.gold>=10){s.gold-=10;s.potions+=2;message('Nessa packs two Potions for the road.')}else if(cmd==='weapon'||cmd==='armor'){const i=Number(arg),arr=cmd==='weapon'?weapons:armors,owned=cmd==='weapon'?s.weapons:s.armors;if(!arr[i]||owned.includes(i)||s.gold<arr[i].price)return;s.gold-=arr[i].price;owned.push(i);s[cmd]=i;message(arr[i].name+' purchased and equipped.')}else if(cmd==='learn'){if(!spells[arg]||s.spells.includes(arg)||s.gold<spells[arg].price)return;s.gold-=spells[arg].price;s.spells.push(arg);message('Learned '+spells[arg].name+'!')}else if(cmd==='buyPotion'&&s.gold>=6){s.gold-=6;s.potions++;message('Bought a Potion.')}else if(cmd==='buyEther'&&s.gold>=10){s.gold-=10;s.ethers++;message('Bought an Ether.')}else if(cmd==='brew'&&s.herbs>=2){s.herbs-=2;s.potions++;message('Brewed a Potion from two herbs.')}else if(cmd==='sellHerb'&&s.herbs){s.herbs--;s.gold+=3;message('Sold one herb for 3 gold.')}else if(cmd==='sellOre'&&s.ore){s.ore--;s.gold+=8;message('Sold one iron ore for 8 gold.')}else if(cmd==='claim'){const q=quests.find(q=>q.id===arg);if(!q||s.claimed.includes(arg)||!q.ready())return;s.claimed.push(arg);s.gold+=q.gold;s.potions+=q.potions||0;s.herbs-=q.herbs||0;message('Quest complete: '+q.title+'! +'+q.gold+' gold, +'+q.xp+' XP.'+award(q.xp));}else if(cmd==='equipWeapon'&&!s.battle&&s.weapons.includes(Number(arg))){s.weapon=Number(arg)}else if(cmd==='equipArmor'&&!s.battle&&s.armors.includes(Number(arg))){s.armor=Number(arg)}else if(cmd==='use'&&!s.battle){if(arg==='potion'&&s.potions&&s.hp<s.maxHp){s.potions--;s.hp=Math.min(s.maxHp,s.hp+25);message('Used a Potion.')}else if(arg==='ether'&&s.ethers&&s.mp<s.maxMp){s.ethers--;s.mp=Math.min(s.maxMp,s.mp+12);message('Used an Ether.')}else if(arg==='mend'&&s.spells.includes('mend')&&s.mp>=4&&s.hp<s.maxHp){s.mp-=4;s.hp=Math.min(s.maxHp,s.hp+16+s.level);message('Mend restored your health.')}}else if(cmd==='export'){const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pocket-quest-save.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return}else if(cmd==='import'){$('importFile').click();return}else if(cmd==='code'||cmd==='paste'){open(cmd);return}else if(cmd==='selectCode'){$('backupCode').focus();$('backupCode').select();return}else if(cmd==='restoreCode'){restore($('restoreCode').value);return}else if(cmd==='new'){if(!confirm('Start over? Export a backup first if you want to keep this adventure.'))return;s=fresh();close()}ui();save();if(modal)renderSheet()}

function drawMap(){const m=maps[s.zone];for(let y=0;y<11;y++)for(let x=0;x<15;x++)tile(m.g[y][x],x*32,y*32,s.zone);(m.buildings||[]).forEach(building);if(s.zone==='town'){rect(7*32-3,6*32-4,38,70,'#b1b3a0');rect(7*32+1,6*32,30,60,'#619eaa');rect(7*32+10,6*32+11,10,35,'#d7d2b2');rect(7*32+4,6*32+20,23,7,'#e0d9bc');}

function draw(){ctx.imageSmoothingEnabled=false;if(s.battle)drawBattle();else drawMap()}
function ui(){$('hptext').textContent=s.hp+' / '+s.maxHp;$('mptext').textContent=s.mp+' / '+s.maxMp;$('hpbar').style.width=(s.hp/s.maxHp*100)+'%';$('mpbar').style.width=(s.mp/s.maxMp*100)+'%';$('gold').textContent=s.gold+' G';$('level').textContent='LEVEL '+s.level;$('place').textContent=s.battle?'Battle · '+maps[s.zone].name:maps[s.zone].name;$('zonehint').textContent=s.battle?'Turn '+(s.battle.turn+1):maps[s.zone].hint;$('log').textContent=s.log;$('walkcontrols').classList.toggle('hidden',!!s.battle);$('battlecontrols').classList.toggle('hidden',!s.battle);if(s.battle){const e=creatures[s.battle.id];$('enemyname').textContent=e.name;$('enemyhp').textContent=Math.max(0,s.battle.hp)+' / '+e.hp;$('enemybar').style.width=Math.max(0,s.battle.hp/e.hp*100)+'%';document.querySelector('[data-fight="strike"]').disabled=s.level<2||s.mp<3;canvas.setAttribute('aria-label','Battle against '+e.name+'. Use the battle menu below.')}else{const o=near();$('interact').textContent=o?(o.type==='exit'?'Travel':'Interact'):'Interact';$('nearby').textContent=o?o.name:'Walk beside a door or object.';canvas.setAttribute('aria-label',maps[s.zone].name+'. Position column '+(s.x+1)+', row '+(s.y+1)+'. '+(o?'Nearby: '+o.name: 'Use the direction buttons to explore.'))}draw()}
let moveTimer=null,repeatTimer=null;function stopMove(){clearTimeout(moveTimer);clearInterval(repeatTimer);moveTimer=repeatTimer=null}

window.addEventListener('blur',stopMove);document.addEventListener('visibilitychange',()=>{stopMove();save()});document.addEventListener('keydown',e=>{if(modal){if(e.key==='Escape')close();if(e.key==='Tab'){const nodes=[...$('overlay').querySelectorAll('button:not(:disabled),textarea,input:not(.hidden)')].filter(n=>!n.classList.contains('hidden'));const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(document.activeElement.tagName==='BUTTON'&&(e.key==='Enter'||e.key===' '))return;const key={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'}[e.key];if(key){e.preventDefault();move(key)}else if(e.key==='Enter'||e.key===' '){e.preventDefault();interact()}});
